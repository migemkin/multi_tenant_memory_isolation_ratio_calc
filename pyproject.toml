[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "migemkin-mmeval_jd471"
version = "0.1.0"
description = "从输入中抽取数值，计算多模态评测工程师·多租户的显存隔离相关的比值与占比，分母为零时明确报错"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "migemkin" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://migemkin.github.io"
Repository = "https://github.com/migemkin/mmeval_jd471"
Issues = "https://github.com/migemkin/mmeval_jd471/issues"

[project.scripts]
mmeval_jd471 = "mmeval_jd471:main"

[tool.setuptools]
py-modules = ["mmeval_jd471"]
